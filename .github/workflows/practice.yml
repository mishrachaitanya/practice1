name: Titanic MLOps CI

on:
  push:
    branches: [ main, newb ]  # Run on main and newbranch
  pull_request:
    branches: [ main, newb ]

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # Step 3: Cache Python dependencies
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Step 4: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    # Step 5: Show directory structure (debugging)
    - name: Show files
      run: ls -R

    # Step 6: Run tests
    - name: Run Tests
      run: pytest --maxfail=1 --disable-warnings -q

    # Step 7: Train Model and Log Metrics
    - name: Train Model and Generate Metrics
      run: |
        python train.py
      env:
        MLFLOW_TRACKING_URI: file:./mlruns  # Local MLflow tracking

    # Step 8: Upload Metrics Artifact
    - name: Upload Metrics Artifact
      uses: actions/upload-artifact@v4
      with:
        name: metrics
        path: metrics/metrics.csv

    # Step 9: Upload Model Artifact
    - name: Upload Model Artifact
      uses: actions/upload-artifact@v4
      with:
        name: titanic_model
        path: model/titanic_model.joblib

